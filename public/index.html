<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Primary SEO -->
    <title>Thomas Piessat — Software Engineer (C++/C#, UE5, Unity)</title>
    <meta
      name="description"
      content="Portfolio of Thomas Piessat: tools & plugins, Unreal Engine 5, Unity, gameplay, and professional projects."
    />
    <link rel="canonical" href="https://thomaspiessat.fr/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thomas Piessat" />
    <meta property="og:title" content="Thomas Piessat — Software Engineer" />
    <meta
      property="og:description"
      content="UE5/Unity tools & plugins, personal, professional, and student projects."
    />
    <!-- Ensure this image exists in /public -->
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:url" content="https://thomaspiessat.fr/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Optional: set these if you have a handle -->
    <!-- <meta name="twitter:site" content="@yourhandle" />
    <meta name="twitter:creator" content="@yourhandle" /> -->

    <!-- Global styles + font preload -->
    <link rel="stylesheet" href="%PUBLIC_URL%/style.css" />
    <!-- Update the path/extension to match your actual font file -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%PUBLIC_URL%/assets/fonts/Josefin_Sans/josefin.woff2"
      crossorigin
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Thomas Piessat",
        "url": "https://thomaspiessat.fr/",
        "jobTitle": "Software Engineer",
        "knowsAbout": ["C++", "C#", "Unreal Engine 5", "Unity", "Tools & Plugins"],
        "sameAs": ["https://github.com/ThomasPiessat"]
      }
    </script>

    <!-- Optional analytics (example: Plausible). Remove if not used.
    <script defer data-domain="thomaspiessat.fr" src="https://plausible.io/js/script.js"></script>
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
